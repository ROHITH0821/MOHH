<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MOHH CRM — Enquiries</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Ccircle cx=%2232%22 cy=%2232%22 r=%2232%22 fill=%22%23C9A66B%22/%3E%3Ctext x=%2232%22 y=%2244%22 font-size=%2236%22 text-anchor=%22middle%22 font-family=%22Georgia,serif%22 fill=%22%231C1915%22%3EM%3C/text%3E%3C/svg%3E">
<meta name="description" content="MOHH Interiors, interior planners and design studio in Hyderabad.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&amp;family=Manrope:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#F7F5F1}
a{color:#7A5C2A}a:hover{color:#4F3A16}
*{box-sizing:border-box}
input,button,textarea{font:inherit}
button{-webkit-tap-highlight-color:transparent}
.noscroll::-webkit-scrollbar{display:none}

/* ---------- MOBILE FIRST (base) ---------- */
.crm{display:flex;flex-direction:column;min-height:100vh}
.side{display:none !important}
.topbar{display:flex !important;position:sticky;top:0;z-index:30}
.tabbar{display:grid !important;position:fixed;left:0;right:0;bottom:0;z-index:40}
.crm-main{padding:16px 14px 104px !important}
.crm-h1{font-size:30px !important}
.crm-sub{display:none !important}
.tools{width:100%}
.tools .search{flex:1 1 100% !important}
.tools .search input{width:100% !important}
.tools .addbtn{flex:1 1 100% !important}
.kpis{display:flex !important;overflow-x:auto;gap:10px !important;margin-left:-14px;margin-right:-14px;padding:0 14px 4px;scrollbar-width:none}
.kpis::-webkit-scrollbar{display:none}
.kpis .kv{font-size:24px !important}
.kpis > *{flex:0 0 150px;min-height:78px !important;padding:12px 14px !important}
.srcs{flex-wrap:nowrap !important;overflow-x:auto;margin-left:-14px;margin-right:-14px;padding:0 14px 4px;scrollbar-width:none}
.srcs > *{flex:none}
.pipe-desk{display:none !important}
.pipe-mob{display:block !important}
.cal-grid{grid-template-columns:1fr !important;min-width:0 !important}
.cal-grid section{min-height:0 !important}
.views{flex-direction:column !important;align-items:stretch !important}
.views > *{flex:1 1 auto !important;width:100%}
.detail{display:none !important}
.detail[data-open="true"]{display:block !important;position:fixed;inset:0;z-index:50;border-radius:0 !important;border:0 !important;overflow-y:auto;padding:0 18px 40px !important}
.detail-head{display:flex !important}
.toast{position:fixed;left:12px;right:12px;bottom:84px;z-index:60;margin:0 !important;box-shadow:0 10px 30px rgba(28,25,21,0.18)}
.addform > *{flex:1 1 100% !important}

/* ---------- TABLET ---------- */
@media (min-width: 600px){
  .crm-main{padding:22px 24px 108px !important}
  .crm-h1{font-size:34px !important}
  .crm-sub{display:block !important}
  .tools{width:auto}
  .tools .search{flex:1 1 260px !important}
  .tools .addbtn{flex:0 0 auto !important}
  .kpis{display:grid !important;grid-template-columns:repeat(3,minmax(0,1fr)) !important;overflow:visible;margin:16px 0 0;padding:0}
  .kpis > *{flex:none}
  .cal-grid{grid-template-columns:repeat(2,minmax(0,1fr)) !important}
  .addform > *{flex:1 1 200px !important}
  .addform > .srcfield{flex:1 1 100% !important}
}

/* ---------- DESKTOP ---------- */
@media (min-width: 1024px){
  .crm{flex-direction:row}
  .side{display:flex !important}
  .topbar,.tabbar{display:none !important}
  .tools{flex-wrap:nowrap !important}
  .tools .search{flex:0 1 280px !important}
  .crm-main{padding:26px 30px 40px !important}
  .crm-h1{font-size:38px !important}
  .kpis{grid-template-columns:repeat(5,minmax(0,1fr)) !important}
  .kpis .kv{font-size:30px !important}
  .kpis > *{min-height:96px !important;padding:16px 18px !important}
  .srcs{flex-wrap:wrap !important;overflow:visible;margin:0;padding:0}
  .pipe-desk{display:block !important}
  .pipe-mob{display:none !important}
  .cal-grid{grid-template-columns:repeat(3,minmax(0,1fr)) !important}
  .views{flex-direction:row !important;flex-wrap:wrap;align-items:flex-start !important}
  .views > .view{flex:999 1 560px !important;width:auto;min-width:0}
  .views > .detail{flex:1 1 330px !important;width:auto}
  .detail,.detail[data-open="true"]{display:block !important;position:static;border-radius:14px !important;border:1px solid #ECE5D9 !important;padding:22px !important;overflow:visible}
  .detail-head{display:none !important}
  .toast{position:static;margin-top:16px !important;box-shadow:none}
}
@media (min-width: 1280px){
  .cal-grid{grid-template-columns:repeat(6,minmax(0,1fr)) !important}
}
</style>
</head>
<body>
<div id="app"></div>
<template id="view">

<div class="crm" style="font-family: 'Manrope', system-ui, sans-serif; color: #1C1915; background: #F7F5F1">

<!-- MOBILE TOP BAR -->
<header class="topbar" style="display: none; align-items: center; justify-content: space-between; gap: 10px; background: #1C1915; padding: 10px 14px">
<div style="display: flex; align-items: center; gap: 10px; min-width: 0">
<span aria-hidden="true" style="flex: none; width: 34px; height: 34px; border-radius: 999px; background: #C9A66B; display: flex; align-items: center; justify-content: center; font-family: 'Cormorant Garamond', serif; font-size: 19px; font-weight: 600; color: #1C1915">M</span>
<div style="min-width: 0">
<p style="margin: 0; font-family: 'Cormorant Garamond', serif; font-size: 18px; font-weight: 600; letter-spacing: 0.16em; color: #FFFFFF; line-height: 1.1">MOHH</p>
<p style="margin: 0; font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase; color: #B4A794; display: flex; align-items: center; gap: 6px"><span aria-hidden="true" style="width: 6px; height: 6px; border-radius: 999px; background: #6BBF8A"></span>Auto-reply on</p>
</div>
</div>
<a href="index.html" style="flex: none; color: #FFFFFF; text-decoration: none; font-size: 13px; font-weight: 600; border: 1px solid #4A4036; border-radius: 999px; padding: 0 14px; min-height: 40px; display: flex; align-items: center">Website</a>
</header>

<!-- SIDEBAR (desktop) -->
<aside class="side" style="flex: 0 0 240px; background: #1C1915; color: #D9CDB9; padding: 24px 16px; flex-direction: column; gap: 24px; position: sticky; top: 0; height: 100vh">
<div style="display: flex; align-items: center; gap: 12px; padding: 0 6px">
<span aria-hidden="true" style="width: 40px; height: 40px; border-radius: 999px; background: #C9A66B; display: flex; align-items: center; justify-content: center; font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 600; color: #1C1915">M</span>
<div>
<p style="margin: 0; font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 600; letter-spacing: 0.16em; color: #FFFFFF">MOHH</p>
<p style="margin: 2px 0 0; font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: #B4A794">Client CRM</p>
</div>
</div>
<nav aria-label="CRM views" style="display: flex; flex-direction: column; gap: 4px; font-size: 14px">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
<button type="button" onClick="{{t.pick}}" aria-current="{{t.current}}" style="{{t.style}}"><span>{{t.label}}</span><span style="font-size: 12px; font-weight: 700; color: #C9A66B">{{t.badge}}</span></button>
</sc-for>
<a href="whatsapp.html" style="color: #D9CDB9; text-decoration: none; padding: 12px 14px; border-radius: 10px; min-height: 44px; display: flex; align-items: center">WhatsApp preview</a>
<a href="index.html" style="color: #D9CDB9; text-decoration: none; padding: 12px 14px; border-radius: 10px; min-height: 44px; display: flex; align-items: center">Back to website</a>
</nav>
<div style="margin-top: auto; padding: 14px; background: #2A241E; border-radius: 12px; font-size: 12px; line-height: 1.6; color: #D9CDB9">
<p style="margin: 0; display: flex; align-items: center; gap: 8px; font-weight: 700; color: #FFFFFF"><span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 999px; background: #6BBF8A"></span>Auto-reply is on</p>
<p style="margin: 4px 0 0">Every new enquiry gets a WhatsApp reply with The Regent photos and consultation slots.</p>
</div>
</aside>

<!-- MAIN -->
<main class="crm-main" style="flex: 1 1 auto; min-width: 0">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 14px">
<div>
<h1 class="crm-h1" style="margin: 0; font-family: 'Cormorant Garamond', serif; font-weight: 600; color: #1C1915; line-height: 1.1">{{viewTitle}}</h1>
<p class="crm-sub" style="margin: 2px 0 0; font-size: 13px; color: #5F574D">Sample data for this concept · tap any enquiry to work on it</p>
</div>
<div class="tools" style="display: flex; flex-wrap: wrap; gap: 10px; align-items: center">
<label class="search" style="display: flex; align-items: center; gap: 8px; background: #FFFFFF; border: 1px solid #E2D9CB; border-radius: 999px; padding: 0 14px; min-height: 46px">
<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5F574D" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search enquiries</span>
<input type="search" value="{{query}}" onChange="{{onQuery}}" placeholder="Search name or area" style="border: 0; outline: none; background: transparent; font-size: 16px; width: 200px; min-height: 42px; color: #1C1915">
</label>
<button type="button" class="addbtn" onClick="{{toggleAdd}}" style="background: #1C1915; border: 0; color: #FFFFFF; border-radius: 999px; padding: 10px 18px; font-size: 14px; font-weight: 600; min-height: 46px; cursor: pointer">{{addLabel}}</button>
</div>
</div>

<!-- TOAST -->
<sc-if value="{{hasToast}}" hint-placeholder-val="{{false}}">
<div role="status" class="toast" style="margin-top: 16px; background: #EAF5EE; border: 1px solid #B9DEC6; color: #1F5135; border-radius: 12px; padding: 10px 8px 10px 16px; display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 14px; font-weight: 600">
<span style="display: flex; align-items: center; gap: 10px"><svg aria-hidden="true" style="flex: none" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2F6B47" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>{{toast}}</span>
<button type="button" onClick="{{clearToast}}" aria-label="Dismiss" style="flex: none; background: transparent; border: 0; color: #1F5135; font-size: 20px; min-width: 44px; min-height: 44px; cursor: pointer">×</button>
</div>
</sc-if>

<!-- ADD ENQUIRY -->
<sc-if value="{{showAdd}}" hint-placeholder-val="{{false}}">
<div class="addform" style="margin-top: 16px; background: #FFFFFF; border: 1px solid #E2C98F; border-radius: 12px; padding: 16px; display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-end">
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 600">Client name<input type="text" value="{{newName}}" onChange="{{onNewName}}" placeholder="e.g. Divya P." style="padding: 10px 12px; border: 1px solid #D9D0C2; border-radius: 8px; min-height: 46px; font-size: 16px"></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 600">Home &amp; area<input type="text" value="{{newHome}}" onChange="{{onNewHome}}" placeholder="e.g. 3BHK · Tellapur" style="padding: 10px 12px; border: 1px solid #D9D0C2; border-radius: 8px; min-height: 46px; font-size: 16px"></label>
<div class="srcfield" style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 600">Source
<div style="display: flex; flex-wrap: wrap; gap: 6px">
<sc-for list="{{newSources}}" as="ns" hint-placeholder-count="4">
<button type="button" onClick="{{ns.pick}}" aria-pressed="{{ns.pressed}}" style="{{ns.style}}">{{ns.label}}</button>
</sc-for>
</div>
</div>
<button type="button" onClick="{{addLead}}" style="background: #C9A66B; border: 0; color: #1C1915; border-radius: 999px; padding: 10px 20px; font-size: 14px; font-weight: 700; min-height: 46px; cursor: pointer">Save &amp; send auto-reply</button>
</div>
</sc-if>

<!-- KPI CARDS -->
<div class="kpis" style="margin-top: 16px; display: grid">
<button type="button" onClick="{{goPipeline}}" style="text-align: left; background: #FFFFFF; border: 1px solid #ECE5D9; border-radius: 14px; cursor: pointer"><span style="display: block; font-size: 13px; color: #5F574D">New enquiries</span><span class="kv" style="display: block; margin-top: 4px; font-weight: 700; color: #1C1915">{{kNew}}</span></button>
<div style="background: #FFFFFF; border: 1px solid #ECE5D9; border-radius: 14px"><p style="margin: 0; font-size: 13px; color: #5F574D">Replied on WhatsApp</p><p class="kv" style="margin: 4px 0 0; font-weight: 700; color: #1C1915">{{kReplied}} <span style="font-size: 11px; font-weight: 600; color: #2F6B47">within a minute</span></p></div>
<button type="button" onClick="{{goCalendar}}" style="text-align: left; background: #FFFFFF; border: 1px solid #ECE5D9; border-radius: 14px; cursor: pointer"><span style="display: block; font-size: 13px; color: #5F574D">Visits this week</span><span class="kv" style="display: block; margin-top: 4px; font-weight: 700; color: #1C1915">{{kVisits}}</span></button>
<button type="button" onClick="{{goToday}}" style="text-align: left; background: #FFF8EB; border: 1px solid #E2C98F; border-radius: 14px; cursor: pointer"><span style="display: block; font-size: 13px; color: #5F574D">Follow-ups today</span><span class="kv" style="display: block; margin-top: 4px; font-weight: 700; color: #8A5A12">{{kDue}}</span></button>
<div style="background: #FFFFFF; border: 1px solid #ECE5D9; border-radius: 14px; display: flex; flex-direction: column; justify-content: center"><p style="margin: 0; font-size: 13px; color: #5F574D">Won</p><p class="kv" style="margin: 4px 0 0; font-weight: 700; color: #1C1915">{{kWon}}</p></div>
</div>

<!-- SOURCE FILTER -->
<div role="group" aria-label="Filter by source" class="srcs noscroll" style="margin-top: 16px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center">
<span style="font-size: 13px; color: #5F574D; margin-right: 4px">Source</span>
<sc-for list="{{sources}}" as="sf" hint-placeholder-count="5">
<button type="button" onClick="{{sf.pick}}" aria-pressed="{{sf.pressed}}" style="{{sf.style}}">{{sf.label}}</button>
</sc-for>
</div>

<div class="views" style="margin-top: 16px; display: flex; gap: 18px; align-items: flex-start">

<!-- PIPELINE -->
<sc-if value="{{isPipeline}}" hint-placeholder-val="{{true}}">
<div class="view">
<!-- desktop board -->
<div class="pipe-desk" style="overflow-x: auto">
<div style="display: grid; grid-template-columns: repeat(4, minmax(190px, 1fr)); gap: 12px; min-width: 800px">
<sc-for list="{{columns}}" as="col" hint-placeholder-count="4">
<section style="background: #EFEAE1; border-radius: 14px; padding: 12px; min-height: 380px">
<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; padding: 2px 4px">
<h2 style="margin: 0; font-size: 14px; font-weight: 700; color: #1C1915">{{col.title}}</h2>
<span style="font-size: 12px; font-weight: 700; color: #5F574D; background: #FFFFFF; padding: 2px 10px; border-radius: 999px">{{col.count}}</span>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{col.cards}}" as="c" hint-placeholder-count="2">
<button type="button" onClick="{{c.pick}}" aria-pressed="{{c.pressed}}" style="{{c.style}}">
<span style="display: flex; justify-content: space-between; gap: 8px; align-items: baseline"><span style="font-size: 14px; font-weight: 700; color: #1C1915">{{c.name}}</span><span style="font-size: 11px; font-weight: 700; color: #8A5A12">{{c.due}}</span></span>
<span style="display: block; margin-top: 4px; font-size: 13px; color: #5F574D">{{c.home}}</span>
<span style="margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center">
<span style="font-size: 11px; font-weight: 600; color: #1C1915; background: #F3EBDC; padding: 3px 9px; border-radius: 999px">{{c.source}}</span>
<span style="font-size: 11px; color: #5F574D">{{c.note}}</span>
</span>
</button>
</sc-for>
<sc-if value="{{col.empty}}" hint-placeholder-val="{{false}}">
<p style="margin: 8px 4px 0; font-size: 13px; color: #5F574D">No enquiries here</p>
</sc-if>
</div>
</section>
</sc-for>
</div>
</div>
<!-- mobile: stage tabs + list -->
<div class="pipe-mob" style="display: none">
<div role="tablist" aria-label="Pipeline stage" class="noscroll" style="display: flex; gap: 6px; overflow-x: auto; margin: 0 -14px; padding: 0 14px 4px; scrollbar-width: none">
<sc-for list="{{mStages}}" as="ms" hint-placeholder-count="4">
<button type="button" role="tab" onClick="{{ms.pick}}" aria-selected="{{ms.selected}}" style="{{ms.style}}">{{ms.label}}<span style="{{ms.countStyle}}">{{ms.count}}</span></button>
</sc-for>
</div>
<div style="margin-top: 12px; display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{mCards}}" as="c" hint-placeholder-count="3">
<button type="button" onClick="{{c.pick}}" style="text-align: left; width: 100%; background: #FFFFFF; border: 1px solid #ECE5D9; border-radius: 14px; padding: 14px 16px; cursor: pointer; display: flex; align-items: center; gap: 12px; min-height: 72px">
<span aria-hidden="true" style="flex: none; width: 42px; height: 42px; border-radius: 999px; background: #F3EBDC; color: #7A5C2A; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px">{{c.initial}}</span>
<span style="flex: 1 1 auto; min-width: 0">
<span style="display: flex; justify-content: space-between; gap: 8px; align-items: baseline"><span style="font-size: 15px; font-weight: 700; color: #1C1915">{{c.name}}</span><span style="flex: none; font-size: 11px; font-weight: 700; color: #8A5A12">{{c.due}}</span></span>
<span style="display: block; margin-top: 2px; font-size: 13px; color: #5F574D; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{c.home}}</span>
<span style="margin-top: 6px; display: flex; gap: 6px; align-items: center; min-width: 0">
<span style="flex: none; font-size: 11px; font-weight: 600; color: #1C1915; background: #F3EBDC; padding: 2px 8px; border-radius: 999px">{{c.source}}</span>
<span style="font-size: 12px; color: #5F574D; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{c.note}}</span>
</span>
</span>
<svg aria-hidden="true" style="flex: none" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#B4A794" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
</button>
</sc-for>
<sc-if value="{{mEmpty}}" hint-placeholder-val="{{false}}">
<p style="margin: 8px 4px; font-size: 14px; color: #5F574D">No enquiries in this stage</p>
</sc-if>
</div>
</div>
</div>
</sc-if>

<!-- FOLLOW-UPS TODAY -->
<sc-if value="{{isToday}}" hint-placeholder-val="{{false}}">
<div class="view" style="background: #FFFFFF; border: 1px solid #ECE5D9; border-radius: 14px; padding: 4px 16px">
<sc-for list="{{dueList}}" as="d" hint-placeholder-count="2">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; padding: 14px 0; border-bottom: 1px solid #F0EAE0">
<button type="button" onClick="{{d.pick}}" style="flex: 1 1 200px; background: transparent; border: 0; text-align: left; padding: 0; cursor: pointer; min-height: 44px">
<span style="display: block; font-size: 15px; font-weight: 700; color: #1C1915">{{d.name}}</span>
<span style="display: block; margin-top: 2px; font-size: 13px; color: #5F574D">{{d.home}} · {{d.stageLabel}}</span>
</button>
<button type="button" onClick="{{d.follow}}" style="flex: 1 1 auto; background: #1C1915; color: #FFFFFF; border: 0; border-radius: 999px; padding: 10px 18px; font-size: 13px; font-weight: 600; min-height: 44px; cursor: pointer">Send WhatsApp follow-up</button>
</div>
</sc-for>
<sc-if value="{{noneDue}}" hint-placeholder-val="{{false}}">
<p style="margin: 0; padding: 28px 0; font-size: 15px; color: #2F6B47; font-weight: 600">All follow-ups are done for today.</p>
</sc-if>
</div>
</sc-if>

<!-- CALENDAR -->
<sc-if value="{{isCalendar}}" hint-placeholder-val="{{false}}">
<div class="view">
<div class="cal-grid" style="display: grid; gap: 10px">
<sc-for list="{{days}}" as="day" hint-placeholder-count="6">
<section style="background: #FFFFFF; border: 1px solid #ECE5D9; border-radius: 14px; padding: 12px; min-height: 260px">
<h2 style="margin: 0 0 10px; font-size: 13px; font-weight: 700; color: #1C1915">{{day.label}}</h2>
<div style="display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{day.visits}}" as="v" hint-placeholder-count="1">
<button type="button" onClick="{{v.pick}}" style="text-align: left; background: #F7F4EF; border: 1px solid #E2C98F; border-radius: 10px; padding: 10px 12px; cursor: pointer; min-height: 48px">
<span style="display: block; font-size: 12px; font-weight: 700; color: #7A5C2A">{{v.time}}</span>
<span style="display: block; margin-top: 2px; font-size: 14px; font-weight: 700; color: #1C1915">{{v.name}}</span>
<span style="display: block; font-size: 12px; color: #5F574D">{{v.home}}</span>
</button>
</sc-for>
<sc-if value="{{day.empty}}" hint-placeholder-val="{{false}}">
<p style="margin: 0; font-size: 12px; color: #8C8276">No visits</p>
</sc-if>
</div>
</section>
</sc-for>
</div>
</div>
</sc-if>

<!-- LEAD DETAIL (side panel on desktop, full screen sheet on mobile) -->
<aside aria-label="Selected enquiry" class="detail" data-open="{{detailOpenStr}}" style="background: #FFFFFF; border: 1px solid #ECE5D9; border-radius: 14px; padding: 22px">
<div class="detail-head" style="display: none; position: sticky; top: 0; z-index: 2; background: #FFFFFF; margin: 0 -18px 6px; padding: 10px 10px 10px 6px; align-items: center; gap: 6px; border-bottom: 1px solid #F0EAE0">
<button type="button" onClick="{{closeDetail}}" aria-label="Back to enquiries" style="background: transparent; border: 0; min-width: 44px; min-height: 44px; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1C1915" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg></button>
<p style="margin: 0; font-size: 15px; font-weight: 700">Enquiry</p>
</div>
<div style="display: flex; justify-content: space-between; align-items: center; gap: 10px; padding-top: 8px">
<p style="margin: 0; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: #7A5C2A">{{sel.stageLabel}}</p>
<span style="font-size: 11px; font-weight: 600; color: #1C1915; background: #F3EBDC; padding: 3px 10px; border-radius: 999px">{{sel.source}}</span>
</div>
<h2 style="margin: 8px 0 2px; font-size: 22px; font-weight: 700; color: #1C1915">{{sel.name}}</h2>
<p style="margin: 0; font-size: 14px; color: #5F574D">{{sel.home}}</p>

<ol aria-label="Stage" style="list-style: none; margin: 16px 0 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px">
<sc-for list="{{steps}}" as="st" hint-placeholder-count="4">
<li style="{{st.style}}" title="{{st.label}}"></li>
</sc-for>
</ol>
<p style="margin: 8px 0 0; font-size: 12px; color: #5F574D">Next: <strong style="color: #1C1915">{{sel.note}}</strong></p>

<sc-if value="{{canBook}}" hint-placeholder-val="{{false}}">
<div style="margin-top: 16px">
<p style="margin: 0 0 8px; font-size: 13px; font-weight: 700">Book a consultation</p>
<div style="display: flex; flex-wrap: wrap; gap: 6px">
<sc-for list="{{slots}}" as="sl" hint-placeholder-count="3">
<button type="button" onClick="{{sl.pick}}" style="flex: 1 1 auto; background: #FFFFFF; border: 1px solid #D9D0C2; color: #1C1915; border-radius: 999px; padding: 8px 14px; font-size: 13px; font-weight: 600; min-height: 44px; cursor: pointer">{{sl.label}}</button>
</sc-for>
</div>
</div>
</sc-if>

<div style="margin-top: 16px; display: flex; flex-wrap: wrap; gap: 8px">
<sc-if value="{{canAdvance}}" hint-placeholder-val="{{true}}">
<button type="button" onClick="{{advance}}" style="flex: 1 1 160px; background: #1C1915; color: #FFFFFF; border: 0; border-radius: 999px; padding: 12px 16px; font-size: 14px; font-weight: 600; min-height: 48px; cursor: pointer">{{advanceLabel}}</button>
</sc-if>
<sc-if value="{{canBack}}" hint-placeholder-val="{{false}}">
<button type="button" onClick="{{moveBack}}" style="flex: 0 1 auto; background: #FFFFFF; color: #1C1915; border: 1px solid #D9D0C2; border-radius: 999px; padding: 12px 16px; font-size: 14px; font-weight: 600; min-height: 48px; cursor: pointer">Move back</button>
</sc-if>
</div>

<p style="margin: 18px 0 8px; font-size: 13px; font-weight: 700">Quick WhatsApp reply</p>
<div style="display: flex; flex-direction: column; gap: 6px">
<sc-for list="{{templates}}" as="tp" hint-placeholder-count="3">
<button type="button" onClick="{{tp.send}}" style="display: flex; justify-content: space-between; align-items: center; gap: 10px; text-align: left; background: #F7F4EF; border: 1px solid #ECE5D9; color: #1C1915; border-radius: 10px; padding: 10px 12px; font-size: 14px; font-weight: 600; min-height: 48px; cursor: pointer">{{tp.label}}<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#7A5C2A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l16-8-6 16-3-7-7-1z"></path></svg></button>
</sc-for>
</div>

<label style="display: flex; flex-direction: column; gap: 6px; margin-top: 16px; font-size: 13px; font-weight: 700">Add a note
<textarea rows="2" value="{{noteText}}" onChange="{{onNote}}" placeholder="e.g. Prefers walnut finishes, budget flexible" style="padding: 10px 12px; border: 1px solid #D9D0C2; border-radius: 10px; font-size: 16px; font-weight: 400; resize: vertical"></textarea></label>
<button type="button" onClick="{{saveNote}}" style="margin-top: 8px; background: transparent; border: 1px solid #D9D0C2; color: #1C1915; border-radius: 999px; padding: 8px 16px; font-size: 13px; font-weight: 600; min-height: 44px; cursor: pointer">Save note</button>

<h3 style="margin: 20px 0 10px; font-size: 13px; font-weight: 700; color: #1C1915">Activity</h3>
<ol style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; font-size: 13px; line-height: 1.5">
<sc-for list="{{sel.activity}}" as="ac" hint-placeholder-count="4">
<li style="display: flex; gap: 10px"><span style="flex: none; width: 70px; color: #5F574D">{{ac.t}}</span><span>{{ac.text}}</span></li>
</sc-for>
</ol>
<a href="whatsapp.html" style="margin-top: 16px; display: flex; align-items: center; justify-content: center; min-height: 44px; font-size: 13px; font-weight: 600; text-decoration: none">Preview the WhatsApp chat</a>
</aside>
</div>
</main>

<!-- MOBILE BOTTOM TAB BAR -->
<nav aria-label="CRM views" class="tabbar" style="display: none; grid-template-columns: repeat(3, 1fr); background: #1C1915; padding: 6px 6px calc(6px + env(safe-area-inset-bottom)); border-top: 1px solid #2A241E">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
<button type="button" onClick="{{t.pick}}" aria-current="{{t.current}}" style="{{t.mStyle}}"><span style="{{t.mBadgeStyle}}">{{t.badge}}</span><span>{{t.short}}</span></button>
</sc-for>
</nav>
</div>
</template>
<script type="text/x-dc">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    const A = (t, text) => ({ t, text });
    this.state = {
      view: 'pipeline', source: 'All', query: '', selected: 1, showAdd: false, toast: '', noteText: '',
      newName: '', newHome: '', newSource: 'Website', nextId: 9, mStage: 0, detailOpen: false,
      leads: [
        { id: 1, name: 'Ananya R.', home: '3BHK, full home · Kokapet', source: 'Website', stage: 0, due: false, visit: null, note: 'Pick a consultation slot', activity: [A('9:42 AM', 'Auto-reply sent on WhatsApp with The Regent photos'), A('9:42 AM', 'Submitted the website form')] },
        { id: 2, name: 'Vikram S.', home: 'Villa · Gachibowli', source: 'Instagram', stage: 0, due: true, visit: null, note: 'Waiting for reply', activity: [A('Yesterday', 'Auto-reply sent on WhatsApp'), A('Yesterday', 'Messaged on Instagram')] },
        { id: 3, name: 'Priya M.', home: 'Kitchen + wardrobes · Kondapur', source: 'WhatsApp', stage: 0, due: false, visit: null, note: 'Pick a consultation slot', activity: [A('10:15 AM', 'Auto-reply sent with slots'), A('10:15 AM', 'Messaged on WhatsApp')] },
        { id: 4, name: 'Rahul & Sneha', home: '4BHK · Financial District', source: 'Website', stage: 1, due: false, visit: { day: 'Thu', time: '11:00 AM' }, note: 'Visit Thu, 11:00 AM', activity: [A('Mon', 'Reminder scheduled for Wed 6:00 PM'), A('Mon', 'Booked Thursday 11:00 AM')] },
        { id: 5, name: 'Farah K.', home: 'Villa · Jubilee Hills', source: 'Referral', stage: 1, due: false, visit: { day: 'Fri', time: '4:00 PM' }, note: 'Visit Fri, 4:00 PM', activity: [A('Tue', 'Booked Friday 4:00 PM'), A('Tue', 'Referred by a past client')] },
        { id: 6, name: 'Meera J.', home: 'Full home · Banjara Hills', source: 'Instagram', stage: 2, due: true, visit: null, note: 'Follow up on 3D design', activity: [A('Today', 'Follow-up reminder'), A('Last week', '3D design presented')] },
        { id: 7, name: 'Karthik V.', home: '3BHK · Narsingi', source: 'Website', stage: 2, due: true, visit: { day: 'Sat', time: '10:30 AM' }, note: 'Share revised quote', activity: [A('Today', 'Follow-up reminder'), A('Sat', 'Design presented at site')] },
        { id: 8, name: 'The Regent', home: 'Full home', source: 'Referral', stage: 3, due: false, visit: null, note: 'Handed over', activity: [A('This month', 'Project handed over')] }
      ]
    };
  }
  autoHide() {
    clearTimeout(this._toastTimer);
    this._toastTimer = setTimeout(() => this.setState({ toast: '' }), 3500);
  }
  update(id, fn, toast) {
    this.setState({ leads: this.state.leads.map(l => l.id === id ? fn(l) : l), toast: toast || this.state.toast });
    if (toast) this.autoHide();
  }
  renderVals() {
    const s = this.state;
    const now = 'Just now';
    const STAGES = ['New enquiry', 'Consultation booked', 'Design presented', 'Won'];
    const SHORT = ['New', 'Booked', 'Design', 'Won'];
    const NEXT = ['Mark consultation done', 'Mark design presented', 'Mark as won'];
    const NEXTNOTE = ['Visit booked', 'Follow up on design', 'Project confirmed'];
    const pill = on => 'border-radius: 999px; padding: 8px 14px; min-height: 40px; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; ' +
      (on ? 'background: #1C1915; color: #FFFFFF; border: 1px solid #1C1915' : 'background: #FFFFFF; color: #1C1915; border: 1px solid #E2D9CB');

    const q = s.query.trim().toLowerCase();
    const visible = s.leads.filter(l => (s.source === 'All' || l.source === s.source) && (!q || (l.name + ' ' + l.home).toLowerCase().includes(q)));
    const select = id => this.setState({ selected: id, noteText: '', detailOpen: true });

    const columns = STAGES.map((title, i) => {
      const cards = visible.filter(l => l.stage === i).map(l => ({
        name: l.name, home: l.home, source: l.source, note: l.note, due: l.due ? 'Due today' : '',
        initial: l.name.charAt(0),
        pressed: String(s.selected === l.id),
        style: 'text-align: left; width: 100%; background: #FFFFFF; border-radius: 12px; padding: 14px; cursor: pointer; display: block; ' + (s.selected === l.id ? 'border: 2px solid #C9A66B; box-shadow: 0 6px 16px rgba(28,25,21,0.10)' : 'border: 2px solid transparent; box-shadow: 0 1px 2px rgba(28,25,21,0.06)'),
        pick: () => select(l.id)
      }));
      return { title, cards, count: String(cards.length), empty: cards.length === 0 };
    });

    const mStages = SHORT.map((label, i) => {
      const on = s.mStage === i;
      return { label, count: columns[i].count, selected: String(on),
        style: 'flex: none; display: flex; align-items: center; gap: 8px; border-radius: 999px; padding: 8px 14px; min-height: 44px; font-size: 14px; font-weight: 600; cursor: pointer; ' + (on ? 'background: #1C1915; color: #FFFFFF; border: 1px solid #1C1915' : 'background: #FFFFFF; color: #1C1915; border: 1px solid #E2D9CB'),
        countStyle: 'font-size: 12px; font-weight: 700; padding: 1px 8px; border-radius: 999px; ' + (on ? 'background: #C9A66B; color: #1C1915' : 'background: #F3EBDC; color: #5F574D'),
        pick: () => this.setState({ mStage: i }) };
    });
    const mCards = columns[s.mStage].cards;

    const sel = s.leads.find(l => l.id === s.selected) || s.leads[0];
    const first = sel.name.split(' ')[0];
    const follow = id => {
      const l = s.leads.find(x => x.id === id);
      this.update(id, x => ({ ...x, due: false, note: x.stage === 0 ? 'Waiting for reply' : x.note, activity: [{ t: now, text: 'Follow-up sent on WhatsApp' }, ...x.activity] }), 'Follow-up sent to ' + l.name + ' on WhatsApp');
    };

    const dueLeads = s.leads.filter(l => l.due);
    const visits = s.leads.filter(l => l.visit);
    const tabs = [['pipeline', 'Enquiries', 'Enquiries', String(s.leads.filter(l => l.stage < 3).length)], ['today', 'Follow-ups today', 'Follow-ups', String(dueLeads.length)], ['calendar', 'Visit calendar', 'Visits', String(visits.length)]]
      .map(([key, label, short, badge]) => {
        const on = s.view === key;
        return { label, short, badge, current: on ? 'page' : 'false',
          style: 'border: 0; text-align: left; padding: 12px 14px; border-radius: 10px; min-height: 44px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; font-size: 14px; ' + (on ? 'background: #3A322A; color: #FFFFFF' : 'background: transparent; color: #D9CDB9'),
          mStyle: 'border: 0; border-radius: 12px; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; cursor: pointer; font-size: 12px; font-weight: 600; ' + (on ? 'background: #3A322A; color: #FFFFFF' : 'background: transparent; color: #B4A794'),
          mBadgeStyle: 'font-size: 16px; font-weight: 700; ' + (on ? 'color: #C9A66B' : 'color: #D9CDB9'),
          pick: () => this.setState({ view: key, detailOpen: false }) };
      });

    const DAYS = [['Mon', 'Mon 16'], ['Tue', 'Tue 17'], ['Wed', 'Wed 18'], ['Thu', 'Thu 19'], ['Fri', 'Fri 20'], ['Sat', 'Sat 21']];
    const days = DAYS.map(([key, label]) => {
      const v = visits.filter(l => l.visit.day === key).map(l => ({ time: l.visit.time, name: l.name, home: l.home, pick: () => select(l.id) }));
      return { label, visits: v, empty: v.length === 0 };
    });

    const SLOTS = [{ day: 'Thu', time: '4:00 PM' }, { day: 'Fri', time: '11:00 AM' }, { day: 'Sat', time: '12:00 PM' }];
    const slots = SLOTS.map(sl => ({
      label: sl.day + ', ' + sl.time,
      pick: () => this.update(sel.id, l => ({ ...l, stage: 1, due: false, visit: sl, note: 'Visit ' + sl.day + ', ' + sl.time,
        activity: [{ t: now, text: 'Confirmation sent on WhatsApp' }, { t: now, text: 'Consultation booked for ' + sl.day + ' ' + sl.time }, ...l.activity] }),
        'Visit booked with ' + sel.name + ' for ' + sl.day + ', ' + sl.time + '. Confirmation sent on WhatsApp')
    }));

    const TEMPLATES = [
      ['Share The Regent photos', 'Sent The Regent photos'],
      ['Ask for the floor plan', 'Asked for the floor plan'],
      ['Send quote reminder', 'Sent a quote reminder']
    ];
    const templates = TEMPLATES.map(([label, done]) => ({ label,
      send: () => this.update(sel.id, l => ({ ...l, due: false, activity: [{ t: now, text: done + ' on WhatsApp' }, ...l.activity] }), done + ' to ' + first + ' on WhatsApp') }));

    const steps = STAGES.map((label, i) => ({ label, style: 'height: 6px; border-radius: 999px; background: ' + (i <= sel.stage ? '#C9A66B' : '#ECE5D9') }));

    const sources = ['All', 'Website', 'WhatsApp', 'Instagram', 'Referral'].map(x => ({ label: x, pressed: String(s.source === x), style: pill(s.source === x), pick: () => this.setState({ source: x }) }));
    const newSources = ['Website', 'WhatsApp', 'Instagram', 'Referral'].map(x => ({ label: x, pressed: String(s.newSource === x), style: pill(s.newSource === x), pick: () => this.setState({ newSource: x }) }));
    const TITLES = { pipeline: 'Enquiries', today: 'Follow-ups due today', calendar: 'Visit calendar' };

    return {
      tabs, sources, newSources, columns, days, slots, templates, steps, mStages, mCards,
      mEmpty: mCards.length === 0,
      detailOpenStr: String(!!s.detailOpen),
      closeDetail: () => this.setState({ detailOpen: false }),
      isPipeline: s.view === 'pipeline', isToday: s.view === 'today', isCalendar: s.view === 'calendar',
      viewTitle: TITLES[s.view],
      goPipeline: () => this.setState({ view: 'pipeline', mStage: 0 }), goToday: () => this.setState({ view: 'today' }), goCalendar: () => this.setState({ view: 'calendar' }),
      dueList: dueLeads.map(l => ({ name: l.name, home: l.home, stageLabel: STAGES[l.stage], pick: () => select(l.id), follow: () => follow(l.id) })),
      noneDue: dueLeads.length === 0,
      kNew: String(s.leads.filter(l => l.stage === 0).length),
      kReplied: String(s.leads.filter(l => l.stage < 3).length),
      kVisits: String(visits.length),
      kDue: String(dueLeads.length),
      kWon: String(s.leads.filter(l => l.stage === 3).length),
      hasToast: !!s.toast, toast: s.toast, clearToast: () => this.setState({ toast: '' }),
      query: s.query, onQuery: e => this.setState({ query: e.target.value }),
      showAdd: s.showAdd, addLabel: s.showAdd ? 'Close' : 'Add enquiry',
      toggleAdd: () => this.setState({ showAdd: !s.showAdd }),
      newName: s.newName, newHome: s.newHome,
      onNewName: e => this.setState({ newName: e.target.value }),
      onNewHome: e => this.setState({ newHome: e.target.value }),
      addLead: () => {
        const name = s.newName.trim() || 'New client';
        const lead = { id: s.nextId, name, home: s.newHome.trim() || 'Home details pending', source: s.newSource, stage: 0, due: false, visit: null, note: 'Pick a consultation slot',
          activity: [{ t: now, text: 'Auto-reply sent on WhatsApp with The Regent photos' }, { t: now, text: 'Enquiry added from ' + s.newSource }] };
        this.setState({ leads: [lead, ...s.leads], selected: s.nextId, nextId: s.nextId + 1, showAdd: false, newName: '', newHome: '', view: 'pipeline', mStage: 0, source: 'All', query: '', toast: name + ' added. Auto-reply sent on WhatsApp' });
        this.autoHide();
      },
      sel: { ...sel, stageLabel: STAGES[sel.stage] },
      canBook: sel.stage === 0,
      canAdvance: sel.stage > 0 && sel.stage < 3,
      canBack: sel.stage > 0,
      advanceLabel: NEXT[sel.stage] || '',
      advance: () => this.update(sel.id, l => ({ ...l, stage: l.stage + 1, due: false, note: NEXTNOTE[l.stage], activity: [{ t: now, text: 'Moved to ' + STAGES[l.stage + 1] }, ...l.activity] }), sel.name + ' moved to ' + STAGES[sel.stage + 1]),
      moveBack: () => this.update(sel.id, l => ({ ...l, stage: l.stage - 1, activity: [{ t: now, text: 'Moved back to ' + STAGES[l.stage - 1] }, ...l.activity] }), sel.name + ' moved back to ' + STAGES[sel.stage - 1]),
      noteText: s.noteText, onNote: e => this.setState({ noteText: e.target.value }),
      saveNote: () => {
        const t = s.noteText.trim();
        if (!t) return;
        this.setState({ noteText: '', toast: 'Note saved for ' + sel.name, leads: s.leads.map(l => l.id === sel.id ? { ...l, activity: [{ t: now, text: 'Note: ' + t }, ...l.activity] } : l) });
        this.autoHide();
      }
    };
  }
}
</script>
<script src="js/preact.min.js"></script>
<script src="js/dc.js"></script>
</body>
</html>
